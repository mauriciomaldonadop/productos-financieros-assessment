<div class="container">
  <div class="form-card">
    <h2 class="form-title">Formulario de Registro</h2>
    <hr class="divider" />

    <form>
      <div class="form-grid">

        <div class="form-group">
          <label>ID</label>
          <input type="text"/>
        </div>

        <div class="form-group">
          <label>Nombre</label>
          <input type="text"/>
        </div>

        <div class="form-group">
          <label>Descripción</label>
          <input type="text"/>

        </div>

        <div class="form-group">
          <label>Logo</label>
          <input type="text"/>
        </div>

        <div class="form-group">
          <label>Fecha Liberación</label>
          <input type="date"/>
        </div>

        <div class="form-group">
          <label>Fecha Revisión</label>
          <input type="date"/>
        </div>

      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" >Reiniciar</button>
        <button type="submit" class="btn-primary">Enviar</button>
      </div>
    </form>
  </div>
</div>
